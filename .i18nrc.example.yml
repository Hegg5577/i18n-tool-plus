# i18n tool plus 配置文件示例
#
# 将此文件复制到项目根目录并重命名为 `.i18nrc.yml`，然后根据需要修改配置项。
# 配置优先级：.i18nrc.yml > IDE Settings > 插件默认值
#

# ============================================================================
# 路径配置
# ============================================================================

# 语言包根目录（相对项目根）
localesPath: src/i18n/locales

# 多目录：非空时替代 localesPath；所有目录共用下方 pathMatcher
# localesPaths:
#   - packages/web/locales
#   - packages/admin/locales

# 路径匹配模式，支持 {locale} 和 {namespace} 占位符
# 示例：
#   - {locale}/{file}        # src/zh/common.json
#   - {locale}/{namespace}.json  # zh/common.json
#   - {namespace}.{locale}.json  # common.zh.json
pathMatcher: "{locale}/{file}"

# 源语言代码（作为「缺失」判定的基准）
sourceLocale: en

# ============================================================================
# 展示配置
# ============================================================================

# 侧边栏优先展示的语言列表（按顺序）
displayLocales:
  - zh
  - en

# 扫描的文件后缀
supportedExtensions:
  - js
  - jsx
  - ts
  - tsx
  - vue
  - html

# 扫描源码的目录列表（相对项目根），用于「缺失检测」
sourceDirs:
  - src

# ============================================================================
# Key 组织形式
# ============================================================================

# key 在语言包里的组织形式
# 可选值：
#   - nested: {"a": {"b": "x"}} 对应 key a.b
#   - flat:   {"a.b": "x"} 对应 key a.b
#   - auto:   两者都支持（推荐）
keyStyle: nested

# ============================================================================
# 命名空间配置（可选）
# ============================================================================

# 启用后源码使用 ns:key；路径模式必须包含 {namespace}，JSON 内不添加前缀
namespaceEnabled: false

# 命名空间分隔符，可以自定义多个字符
namespaceDelimiter: ":"

# ============================================================================
# 行内提示配置
# ============================================================================

# 是否启用行内译文提示（在 t('key') 之后显示译文）
inlineAnnotationEnabled: true

# 行内提示的译文语言（留空表示跟随 displayLocales 第一项）
annotationLocale: ""

# 首选语言缺 key 时是否回退显示源语言原文
fallbackToSource: true

# ============================================================================
# 批量翻译配置
# ============================================================================

# false：补齐缺失或空白译文；true：重新翻译已有译文，确认弹窗会提示覆盖风险
overrideExisting: false

# ============================================================================
# 翻译引擎配置
# ============================================================================

# 活跃的翻译引擎 ID
# 可选值：google、google-cn、deepl、baidu、libretranslate、openai、ollama；兼容旧 google-free
activeTranslationEngine: google-free

# --- DeepL 配置 ---
# DeepL API Key（申请地址：https://www.deepl.com/docs-api）
# deeplApiKey: "YOUR_DEEPL_API_KEY"

# DeepL 是否使用免费版 API（true=免费版，false=专业版）
# deeplIsFreeApi: true

# --- OpenAI 配置 ---
# OpenAI API Key（申请地址：https://platform.openai.com/api-keys）
# openaiApiKey: "sk-..."

# OpenAI 模型名称
# openaiModel: "gpt-3.5-turbo"

# OpenAI API 基础 URL（支持代理或自建 API）
# openaiBaseUrl: "https://api.openai.com/v1"

# Google：密钥可选；填写后使用 Cloud API，不填写则使用免费端点
# 国际与国内选项共用以下配置；自定义地址须符合对应协议
# googleApiKey: "YOUR_GOOGLE_CLOUD_KEY"
# googleApiUrl: ""

# DeepL 完整请求地址：可选免费版、专业版，也可输入兼容 DeepL v2 的中转地址
# 非空时优先于 deeplIsFreeApi；官方专业版地址为 https://api.deepl.com/v2/translate
# deeplApiUrl: "https://api-free.deepl.com/v2/translate"

# 百度通用翻译
# baiduAppId: "YOUR_BAIDU_APP_ID"
# baiduApiSecret: "YOUR_BAIDU_SECRET"
# baiduApiUrl: "https://fanyi-api.baidu.com/api/trans/vip/translate"

# LibreTranslate：通常无需密钥，具体取决于实例配置
# libreTranslateApiUrl: "http://localhost:5000/translate"
# libreTranslateApiKey: ""

# Ollama：先启动本地服务，并将模型名改为本机已下载的完整名称
# ollamaBaseUrl: "http://localhost:11434"
# ollamaModel: ""
