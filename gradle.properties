org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true

# 固定 Gradle 守护进程所用的 JDK（本机 java 不在 PATH，无 JDK 17+）。
# 注意：gradlew 启动脚本自身也要求 JAVA_HOME，仅靠这一行不够 ——
#      请用项目根目录的 dev.cmd 启动（它会先设好 JAVA_HOME 再调 gradlew）。
org.gradle.java.home=D:/IntelliJ IDEA 2026.1.4/jbr

# IntelliJ Platform 插件开发：不自动引入 Kotlin stdlib，由平台提供
kotlin.stdlib.default.dependency=false
